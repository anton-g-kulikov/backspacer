<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- macOS icon grid: 824×824 squircle centred in 1024 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="free" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5df2a0"/>
      <stop offset="1" stop-color="#19c26d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <path d="M100 285 C100 155 155 100 285 100 H739 C869 100 924 155 924 285 V739 C924 869 869 924 739 924 H285 C155 924 100 869 100 739 Z"
        fill="url(#bg)" filter="url(#shadow)"/>

  <!-- One full ring (r=240): white = used 270°, green = free 90°, flush. -->
  <g transform="translate(512 512)" fill="none" stroke-width="96" stroke-linecap="butt">
    <circle r="240" stroke="#f2f4f8"
            stroke-dasharray="1130.97 9999" transform="rotate(-90)"/>
    <circle r="240" stroke="url(#free)"
            stroke-dasharray="377 9999" transform="rotate(180)"/>
  </g>
</svg>
