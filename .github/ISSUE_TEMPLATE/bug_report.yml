name: Bug report
description: Something went wrong, or a size looks wrong.
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Backspacer version, description: About panel → Version (hover for the build). }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version and chip, placeholder: "macOS 26.1, Apple M2" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you clicked, what you expected, what you saw. }
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Diagnostics log
      description: About → Reveal log, then paste the relevant part of ~/Library/Logs/Backspacer/Backspacer.log. It names the folders the app measured — trim what you'd rather not share.
      render: text
