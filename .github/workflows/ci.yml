name: CI

# Tags are release.yml's job (it runs these tests itself before signing); CI covers main and PRs.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here needs to write to the repo, and a PR from a fork must not be able to.
permissions:
  contents: read

# `shell: bash` runs steps with `-eo pipefail`; the default `bash -e` lets `cmd | tail`
# hide cmd's failure behind tail's exit code.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: swift test + release build
    runs-on: macos-15
    steps:
      # SHA-pinned (v5.0.0): a tag can be moved, a commit can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the newest Xcode 16 on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$XCODE" || { echo "no Xcode 16 on this runner"; ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$XCODE"
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Tests
        run: swift test 2>&1 | tail -30
      - name: Test dependencies (axe-core, jsdom — nothing ships)
        run: npm ci --no-fund --no-audit
      - name: Web logic, accessibility and brand tests (node)
        run: node --test 'Tests/web/logic.test.js' 'Tests/web/a11y.test.js' 'Tests/web/axe.test.js' 'Tests/web/brand.test.js' 'Tests/web/release.test.js'
      - name: Catalog parses and validates
        run: |
          python3 -c "import json; json.load(open('catalog.json')); json.load(open('catalog.schema.json'))"
          plutil -lint scripts/entitlements.plist
      - name: Release build (universal)
        run: swift build -c release --arch arm64 --arch x86_64 2>&1 | tail -5
      # Prove the packaged app assembles and signs (ad-hoc — no Developer ID on CI). UNIVERSAL=1
      # reuses the build above: a native `swift build` after a universal one in the same .build
      # aborts with `error: fatalError` on the Swift 6.0 toolchain (Xcode 16).
      - name: Package and verify the app bundle
        run: |
          UNIVERSAL=1 scripts/build-app.sh
          codesign --verify --deep --strict build/Backspacer.app
          plutil -lint build/Backspacer.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Backspacer.app/Contents/Info.plist
