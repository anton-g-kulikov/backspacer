name: Release

# Pushing a version tag builds, signs, notarizes and publishes the DMG — the manual steps 3–8 of
# _meta/release-checklist.md. Needs five repository secrets (see the checklist):
#   MACOS_CERT_P12        base64 of the Developer ID Application certificate + key (.p12)
#   MACOS_CERT_PASSWORD   the .p12's password
#   APPLE_ID              the Apple ID that owns the team
#   APPLE_APP_PASSWORD    an app-specific password for it
#   APPLE_TEAM_ID         the team id (R9BBCR3NF6)
#   SPARKLE_ED_KEY        the private EdDSA key from Sparkle's generate_keys -x (signs the appcast)
# Without them the signing step fails before anything is published.

on:
  push:
    tags: ['v*']

# contents: write publishes the release; id-token: write signs the provenance attestation and
# attestations: write stores it (without it the attest step fails with "Resource not accessible").
permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: build, notarize, publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build-app.sh reads the version from git describe --tags
      - name: Select the newest Xcode 16 on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$XCODE" || { echo "no Xcode 16 on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
      - name: Tests
        run: swift test 2>&1 | tail -30
      - name: Test dependencies (axe-core, jsdom — nothing ships)
        run: npm ci --no-fund --no-audit
      - name: Web tests (node)
        run: node --test 'Tests/web/logic.test.js' 'Tests/web/a11y.test.js' 'Tests/web/axe.test.js' 'Tests/web/brand.test.js' 'Tests/web/release.test.js'
      - name: Changelog has this version
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^## $V " CHANGELOG.md || { echo "CHANGELOG.md has no '## $V' section"; exit 1; }

      # The certificate goes into a throwaway keychain; the always() step below removes it.
      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          test -n "$CERT_P12" || { echo "secret MACOS_CERT_P12 is not set — see .github/workflows/release.yml"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${{ secrets.MACOS_CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY" || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build (universal, signed)
        run: scripts/build-app.sh
      - name: Notarize, staple, DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/notarize.sh
      - name: Verify as a user would
        run: |
          DMG="build/Backspacer-${GITHUB_REF_NAME#v}.dmg"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          xcrun stapler validate "$DMG"

      # Sparkle (ADR-21): sign the stapled DMG with the EdDSA key and write the appcast the app
      # polls. The key never touches the command line; the appcast ships as a release asset.
      - name: Changelog section for this version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -n "/^## $V /,/^## /p" CHANGELOG.md | sed '1d;$d' | sed '/^$/d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "empty changelog section for $V"; exit 1; }
      - name: Sign for Sparkle and write the appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          test -n "$SPARKLE_ED_KEY" || { echo "secret SPARKLE_ED_KEY is not set"; exit 1; }
          V="${GITHUB_REF_NAME#v}"
          DMG="build/Backspacer-$V.dmg"
          PATH=".build/artifacts/sparkle/Sparkle/bin:$PATH"   # Sparkle's tools come with the SwiftPM artifact
          KEYFILE="$RUNNER_TEMP/sparkle_ed_key"; (umask 077; printf '%s' "$SPARKLE_ED_KEY" > "$KEYFILE")
          OUT="$(sign_update --ed-key-file "$KEYFILE" "$DMG")"; rm -P "$KEYFILE"
          SIG="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$OUT")"
          LEN="$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<<"$OUT")"
          test -n "$SIG" && test -n "$LEN" || { echo "sign_update gave no signature: $OUT"; exit 1; }
          BUILD_NUM="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/Backspacer.app/Contents/Info.plist)"
          scripts/make-appcast.sh "$V" "$BUILD_NUM" "$LEN" "$SIG" \
            "https://github.com/anton-g-kulikov/backspacer/releases/download/v$V/Backspacer-$V.dmg" \
            "https://github.com/anton-g-kulikov/backspacer/releases/tag/v$V" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/appcast.xml"
          xmllint --noout "$RUNNER_TEMP/appcast.xml"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          DMG="build/Backspacer-$V.dmg"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          { cat "$RUNNER_TEMP/notes.md"; echo; echo "SHA-256 \`Backspacer-$V.dmg\`: \`$SHA\`"; } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then echo "a release for ${GITHUB_REF_NAME} already exists — delete it (and re-tag) to publish again"; exit 1; fi
          gh release create "${GITHUB_REF_NAME}" "$DMG" "$RUNNER_TEMP/appcast.xml" --title "Backspacer $V" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/Backspacer-*.dmg

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true

  # The site republishes the appcast at backspacer.dev/appcast.xml. Called here because the
  # release above was created with GITHUB_TOKEN, whose events never trigger other workflows.
  site:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      required: true
      tag: ${{ github.ref_name }}   # this release's asset, not "latest", which can still point at the previous one
