name: Pages

# Publishes site/ (the promo page at backspacer.dev) through GitHub Pages' Actions
# deployment. The site tests gate the deploy: a missing or broken page fails the run.
#
# The Sparkle feed the app reads, https://backspacer.dev/appcast.xml, is not a file on main:
# the release workflow publishes appcast.xml as a release asset (the branch ruleset keeps the
# Actions token from pushing), and this job copies the latest one into the Pages artifact —
# on every push that touches the site, and on every published release.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'catalog.json'
      - 'Tests/web/site.test.js'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: test + deploy site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Site tests (a missing page fails, never skips)
        env:
          SITE_REQUIRED: 1
        run: node --test 'Tests/web/site.test.js'
      - name: Latest appcast into the artifact
        # Assets can still be uploading when the release event fires, so retry for a while.
        # A release event without a usable appcast fails the deploy; a plain site push
        # tolerates "no appcast yet" (before the first Sparkle release) but never a broken one.
        env:
          FEED: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          REQUIRED: ${{ github.event_name == 'release' }}
        run: |
          sudo apt-get install -y -qq libxml2-utils >/dev/null
          for i in $(seq 1 12); do
            code=$(curl -fsSL -o site/appcast.xml -w '%{http_code}' "$FEED" || true)
            [ "$code" = "200" ] && break
            [ "$code" = "404" ] && [ "$REQUIRED" != "true" ] && { echo "no appcast on the latest release yet — skipping"; rm -f site/appcast.xml; exit 0; }
            echo "appcast not available yet (http $code), retry $i"; sleep 10
          done
          [ -s site/appcast.xml ] || { echo "no appcast on the latest release"; exit 1; }
          xmllint --noout site/appcast.xml
          grep -q '<enclosure' site/appcast.xml && grep -q 'sparkle:version' site/appcast.xml || { echo "appcast has no Sparkle enclosure"; exit 1; }
          echo "appcast: $(grep -o 'sparkle:shortVersionString="[^"]*"' site/appcast.xml | head -1)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
